name: Import QPV Bretagne

on:
  push:
    branches: [main]
    paths:
      - data/.import-qpv-trigger

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer GDAL
        run: sudo apt-get update && sudo apt-get install -y gdal-bin
      - name: Télécharger et filtrer les QPV Bretagne
        run: |
          curl -L "https://www.data.gouv.fr/api/1/datasets/r/122b44dd-99f8-4d00-9e0e-d1048bedf464" -o /tmp/qpv.zip
          mkdir -p /tmp/qpv
          unzip -o /tmp/qpv.zip -d /tmp/qpv
          SHP=$(find /tmp/qpv -type f -iname '*.shp' | head -n 1)
          ogr2ogr -f GeoJSON data/QPV_2024_Bretagne_WGS84.geojson "$SHP" -where "insee_reg = '53'" -t_srs EPSG:4326 -lco RFC7946=YES
      - name: Contrôler le résultat
        run: |
          python - <<'PY'
          import json
          with open('data/QPV_2024_Bretagne_WGS84.geojson', encoding='utf-8') as f:
              data = json.load(f)
          assert len(data.get('features', [])) == 31, f"Nombre inattendu de QPV: {len(data.get('features', []))}"
          print('31 QPV Bretagne exportés')
          PY
      - name: Commit du fichier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/QPV_2024_Bretagne_WGS84.geojson
          git commit -m "Ajouter les QPV 2024 Bretagne" || exit 0
          git push
